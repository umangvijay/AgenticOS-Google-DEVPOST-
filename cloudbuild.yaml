# API image only (root Dockerfile). No worker service.
# Cloud Run GitHub continuous deployment should use the root Dockerfile
# and should NOT also attach a trigger to this file — that would double-build.
# `gcloud run deploy --source` uses this file if present; it must not deploy
# a second service. Cloud Run itself deploys the image this build produces.
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '-f', 'Dockerfile', '.']
images:
  - '${_IMAGE}'
substitutions:
  _IMAGE: 'gcr.io/${PROJECT_ID}/agentos-api'
